version: 2.1
jobs:
  build:
    docker:
      - image: 218546966473.dkr.ecr.us-east-1.amazonaws.com/circle-ci:stitch-tap-tester-uv
    steps:
      - checkout
      - run:
          name: 'Setup virtual env'
          command: |
            uv venv --python 3.12 /usr/local/share/virtualenvs/tap-snapchat-ads
            source /usr/local/share/virtualenvs/tap-snapchat-ads/bin/activate
            uv pip install -U pip setuptools
            uv pip install -e .[dev]
      - run:
          name: 'pylint'
          command: |
            source /usr/local/share/virtualenvs/tap-snapchat-ads/bin/activate
            pylint tap_snapchat_ads -d C,W,R,E0606
      - run:
          name: 'JSON Validator'
          command: |
            source /usr/local/share/virtualenvs/tap-tester/bin/activate
            stitch-validate-json tap_snapchat_ads/schemas/*.json
      - run:
          name: 'Unit Tests'
          command: |
            source /usr/local/share/virtualenvs/tap-snapchat-ads/bin/activate
            mkdir -p test_output
            coverage run --source=tap_snapchat-ads -m pytest tests/unittests --junitxml=test_output/report.xml
          when: always
      - run:
          name: 'Coverage Report'
          command: |
            source /usr/local/share/virtualenvs/tap-snapchat-ads/bin/activate
            coverage report -m --fail-under=99
            coverage html
          when: always
      - store_test_results:
          path: test_output
      - store_artifacts:
          path: htmlcov
      - store_artifacts:
          path: coverage.txt
      - run:
          name: 'Integration Tests'
          command: |
            source /usr/local/share/virtualenvs/tap-tester/bin/activate
            uv pip install --upgrade awscli
            aws s3 cp s3://com-stitchdata-dev-deployment-assets/environments/tap-tester/tap_tester_sandbox dev_env.sh
            source dev_env.sh
            run-test --tap=tap-snapchat-ads tests
workflows:
  version: 2
  commit:
    jobs:
      - build:
          context: circleci-user
  build_daily:
    triggers:
      - schedule:
          cron: "0 0 * * *"
          filters:
            branches:
              only:
                - master
    jobs:
      - build:
          context: circleci-user
